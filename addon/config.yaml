name: Hisense Local
version: "0.1.5"
slug: hisense_local
description: Serves a Hisense washer at home and bridges it to MQTT
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
timeout: 30
ingress: false
ports:
  4444/tcp: 4444
ports_description:
  4444/tcp: Washer TLS link
map:
  - type: share
    read_only: false
options:
  mqtt_url: "mqtt://core-mosquitto:1883"
  mqtt_user: ""
  mqtt_password: ""
  peer_ip: ""
  discovery: device
  active_session: ""
  capture_date: ""
  cloud_addr: ""
  calibrate: false
  calibrate_cycle: false
schema:
  mqtt_url: str
  mqtt_user: str?
  mqtt_password: password?
  peer_ip: str?
  discovery: list(device|per_entity)
  active_session: str?
  capture_date: str?
  cloud_addr: str?
  calibrate: bool
  calibrate_cycle: bool
