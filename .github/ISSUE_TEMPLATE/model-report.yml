name: Does my model work?
description: Report how Hisense Local behaves with your washer model.
title: "[Model] "
labels: ["model report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Never paste session files, keys, tokens, the wifiId, the puid,
        e-mail addresses or command blobs: whoever holds them can drive your washer. Remove them
        from logs before posting.
  - type: input
    id: model
    attributes:
      label: Washer model
      description: As printed on the label inside the door or on the back.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: If you know it (shown in the vendor app). Leave empty otherwise.
  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Works
        - Partly works
        - Does not work
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: What you tested
      description: Login, status, start/pause, program select, options, calibration... What worked and what did not.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add-on log lines around the problem, with secrets removed. No session files, keys, wifiId or puid.
      render: text
  - type: checkboxes
    id: secrets
    attributes:
      label: Check before posting
      options:
        - label: I removed session files, keys, tokens, the wifiId, the puid and e-mail addresses from everything above.
          required: true
