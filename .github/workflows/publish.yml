name: publish

# Builds the add-on image for each architecture and pushes it to GHCR, tagged with the version in
# addon/config.yaml. Home Assistant then pulls it instead of building on the user's machine.
on:
  push:
    branches: [main]
    paths: ["addon/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - id: info
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"$/\1/p' addon/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "from=$(sed -n 's/^ *${{ matrix.arch }}: *//p' addon/build.yaml)" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.arch }}" = aarch64 ]; then echo "platform=linux/arm64"; else echo "platform=linux/amd64"; fi >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: addon
          platforms: ${{ steps.info.outputs.platform }}
          build-args: BUILD_FROM=${{ steps.info.outputs.from }}
          push: true
          tags: ghcr.io/justanotherpu/${{ matrix.arch }}-hisense-local:${{ steps.info.outputs.version }}
          labels: |
            io.hass.name=Hisense Local
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/JustAnotherPU/hisense-local
